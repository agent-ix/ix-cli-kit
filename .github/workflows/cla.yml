name: Contributor agreement

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: write
  issues: write
  statuses: write
  contents: write

jobs:
  agreement:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    uses: agent-ix/.github/.github/workflows/cla-assistant-lite.yml@main
